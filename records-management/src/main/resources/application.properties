spring.application.name=records-management
datasource:
url: ${POSTGRES_DB_URL:jdbc:postgresql://dz-postgres:5432/postgres}
username: ${POSTGRES_DB_USER:postgres}
password: ${POSTGRES_DB_PASSWORD:DUMMY_VALUE}
hikari:
maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
jpa:
open-in-view: ${JPA_OPEN_IN_VIEW:true}
show-sql: ${SHOW_SQL:false}
hibernate:
naming:
implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
properties:
hibernate:
dialect: org.hibernate.dialect.PostgreSQLDialect
globally_quoted_identifiers: true
default_schema: ${POSTGRES_DB_DEFAULT_SCHEMA:public}
jdbc:
lob:
non_contextual_creation: true